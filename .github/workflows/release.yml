name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify the release version
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm ci
      - run: npm test
      - name: Publish the Apple Silicon desktop executable
        run: |
          dotnet publish gui/MultiGrokStateGui -c Release -r osx-arm64 --self-contained true \
            -p:Version="${RELEASE_TAG#v}" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -o "$RUNNER_TEMP/gui"
          codesign --force --sign - "$RUNNER_TEMP/gui/MultiGrokStateGui"
          codesign --verify --strict "$RUNNER_TEMP/gui/MultiGrokStateGui"
          zip -j "$RUNNER_TEMP/MultiGrokState-macOS-arm64.zip" "$RUNNER_TEMP/gui/MultiGrokStateGui"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --notes-from-tag \
            --title "MultiGrokState ${RELEASE_TAG#v}" "$RUNNER_TEMP/MultiGrokState-macOS-arm64.zip"
