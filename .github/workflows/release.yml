name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify the release version
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm ci
      - run: npm test
      - name: Publish the Apple Silicon desktop executable
        run: |
          dotnet publish gui/MultiGrokStateGui -c Release -r osx-arm64 --self-contained true \
            -p:Version="${RELEASE_TAG#v}" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -o "$RUNNER_TEMP/gui"
          app="$RUNNER_TEMP/MultiGrokState.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp gui/MultiGrokState.app/Contents/Info.plist "$app/Contents/"
          cp gui/MultiGrokState.app/Contents/Resources/AppIcon.icns "$app/Contents/Resources/"
          install -m 755 "$RUNNER_TEMP/gui/MultiGrokStateGui" "$app/Contents/MacOS/MultiGrokState"
          codesign --force --sign - "$app"
          ditto -c -k --norsrc --keepParent "$app" "$RUNNER_TEMP/MultiGrokState-macOS-arm64.zip"
      - name: Verify the archived app and icon
        run: |
          ditto -x -k "$RUNNER_TEMP/MultiGrokState-macOS-arm64.zip" "$RUNNER_TEMP/unpacked"
          app="$RUNNER_TEMP/unpacked/MultiGrokState.app"
          plist="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "${RELEASE_TAG#v}"
          test -x "$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")"
          icon=$(plutil -extract CFBundleIconFile raw "$plist")
          cmp "$app/Contents/Resources/$icon" gui/MultiGrokState.app/Contents/Resources/AppIcon.icns
          codesign --verify --strict "$app"
      - name: Test refresh in the packaged app
        run: bash test/macos-refresh.sh "$RUNNER_TEMP/unpacked/MultiGrokState.app/Contents/MacOS/MultiGrokState"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --notes-from-tag \
            --title "MultiGrokState ${RELEASE_TAG#v}" "$RUNNER_TEMP/MultiGrokState-macOS-arm64.zip"
